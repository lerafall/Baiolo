<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Petal Puzzle · Baiolo demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="fall" id="fall" aria-hidden="true"></div>
    <main class="shell">
      <header class="hud">
        <div class="level-card">
          <p>Level <strong id="level">1</strong></p>
          <div class="dots" id="dots" aria-hidden="true"></div>
        </div>
        <div class="leaves">🌿 <strong id="leaves">125</strong></div>
      </header>

      <aside class="tools">
        <button type="button" id="undoBtn" class="tool undo" title="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8H5V4m0 4a8 8 0 1 1-2 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Undo</span>
        </button>
        <button type="button" id="restartBtn" class="tool restart" title="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.4M20 5v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Restart</span>
        </button>
        <button type="button" id="hintBtn" class="tool hint" title="Hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-3.5 10.8c.7.6 1.1 1.3 1.2 2.2h4.6c.1-.9.5-1.6 1.2-2.2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Hint</span>
          <i id="hintCount">3</i>
        </button>
      </aside>

      <section class="stage">
        <div class="wheel" id="wheel" aria-label="Flower petal wheel"></div>
        <p class="breath">Take a deep breath ♡</p>
      </section>

      <div class="tray" aria-label="Next petal">
        <button type="button" id="trayPetal" class="petal tray-petal" aria-label="Place petal into empty slot"></button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
