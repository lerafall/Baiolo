<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Star Catch · Baiolo demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="frame" id="game">
      <div class="sky" aria-hidden="true"></div>
      <div class="hills" aria-hidden="true"></div>
      <div class="trees" aria-hidden="true"></div>
      <div class="ground" aria-hidden="true"></div>

      <div class="hud">
        <div class="pill">Score <strong id="score">0</strong></div>
        <div class="pill">Time <strong id="time">30</strong></div>
      </div>

      <div id="tokens" class="tokens" aria-hidden="true"></div>

      <button type="button" id="bucket" class="bucket" aria-label="Move catcher">
        <span class="wing left"></span>
        <span class="wing right"></span>
        <span class="pot">
          <span class="star">★</span>
          <span class="star small">★</span>
          <span class="star small">★</span>
        </span>
      </button>

      <div id="overlay" class="overlay">
        <p class="title">Star Catch</p>
        <p class="body">Drag the bucket. Catch gold & teal stars.</p>
        <button type="button" id="startBtn" class="start">Play</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
