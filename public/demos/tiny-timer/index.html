<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tiny Timer · Baiolo demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <p class="eyebrow">Baiolo demo</p>
        <h1>Tiny Timer</h1>
        <p class="lede">Focus bubbles for short tasks.</p>
      </header>

      <section class="card" aria-label="Timer">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52" />
            <circle id="ringProgress" class="ring-progress" cx="60" cy="60" r="52" />
          </svg>
          <p id="display" class="time" aria-live="polite">5:00</p>
        </div>

        <div class="presets" role="group" aria-label="Duration">
          <button type="button" class="chip active" data-seconds="60">1m</button>
          <button type="button" class="chip" data-seconds="300">5m</button>
          <button type="button" class="chip" data-seconds="600">10m</button>
          <button type="button" class="chip" data-seconds="1500">25m</button>
        </div>

        <div class="actions">
          <button type="button" id="startBtn" class="btn primary">Start</button>
          <button type="button" id="resetBtn" class="btn ghost">Reset</button>
        </div>

        <p id="status" class="status">Pick a length, then start when you’re ready.</p>
      </section>

      <div id="bubbles" class="bubbles" aria-hidden="true"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
