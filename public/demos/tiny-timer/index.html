<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tiny Timer · Baiolo demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bubbles" id="bubbles" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">🌱</span>
          <span class="brand-name">Tiny Timer</span>
        </div>
        <nav class="tabs" aria-label="Sections">
          <button type="button" class="tab active" data-tab="timer">⏱ Timer</button>
          <button type="button" class="tab" data-tab="stats">📊 Stats</button>
          <button type="button" class="tab" data-tab="settings">⚙ Settings</button>
        </nav>
        <div class="badge">🌱 Good focus ✦</div>
      </header>

      <section id="panel-timer" class="panel">
        <p class="kicker">🌱 Focus on what matters</p>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="50" />
            <circle id="progress" class="progress" cx="60" cy="60" r="50" />
            <circle id="knob" class="knob" cx="60" cy="10" r="4.5" />
          </svg>
          <div class="ring-copy">
            <p class="label">FOCUS</p>
            <p id="display" class="time">12:00</p>
            <p class="end-sound">🔔 End sound</p>
          </div>
        </div>
        <button type="button" id="startBtn" class="start">▶ Start Focus</button>
        <div class="presets">
          <button type="button" class="preset" data-seconds="300">🌱 Short Break<br /><strong>5:00</strong></button>
          <button type="button" class="preset active" data-seconds="720">✨ Focus<br /><strong>12:00</strong></button>
          <button type="button" class="preset" data-seconds="900">☕ Long Break<br /><strong>15:00</strong></button>
        </div>
      </section>

      <section id="panel-stats" class="panel hidden">
        <p class="kicker">Your calm streak</p>
        <div class="stat-card">
          <p>Sessions today</p>
          <strong id="statSessions">0</strong>
        </div>
        <div class="stat-card">
          <p>Focus minutes</p>
          <strong id="statMinutes">0</strong>
        </div>
      </section>

      <section id="panel-settings" class="panel hidden">
        <p class="kicker">Settings</p>
        <label class="setting">
          <span>Soft end chime</span>
          <input id="chimeToggle" type="checkbox" checked />
        </label>
        <p class="hint">Custom lengths: use the presets for now.</p>
      </section>

      <footer class="quote">🌱 <em>Little by little, a little becomes a lot.</em></footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
