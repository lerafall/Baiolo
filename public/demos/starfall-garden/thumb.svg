    <ellipse cx="-14" cy="6" rx="16" ry="9" fill="#f9a8d4" transform="rotate(-55)"/>
    <circle r="9" fill="#fde68a"/>
  </g>
  <g transform="translate(130 250)">
    <circle r="18" fill="#fde68a" opacity="0.3"/>
    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#fef08a"/>
